[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lgtvctrl"
version = "0.1.0"
description = "Control LG TV via WebOS network API (bscpylgtv-based)"
requires-python = ">=3.12"
dependencies = [
    "bscpylgtv>=0.5.3,<0.6",
    "wakeonlan==3.1.0",
]

[project.scripts]
tv = "lgtvctrl.main:main"

[tool.poe.tasks]
# The release engine runs this with the package as its working directory.
test = { sequence = [
  { cmd = "ruff format --check ." },
  { cmd = "ruff check ." },
  { cmd = "pytest tests" },
], help = "the package's release gate" }
