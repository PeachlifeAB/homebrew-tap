# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# One Keep a Changelog section per product. The release engine supplies what
# differs per product (tag pattern, package path, tag, repository slug); this
# file owns the format, the grouping and which commits are announced.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# Tags are `<product>-<version>`; the section and its link show only the version.
# Groups carry a numeric prefix so they render in Keep a Changelog's fixed order
# (alphabetical order would put Added before Changed but Fixed before Removed).
body = """
{% if version -%}
    ## [{{ version | split(pat="-") | last }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | split(pat="-") | last }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}...{{ release.version }}
    {% elif not release.version and release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
# Only Conventional Commits are announced; anything else is not a user-facing change.
filter_unconventional = true
filter_commits = true
# Announced types, in Keep a Changelog order. Every other type (chore, ci, style,
# docs, test, build, deps, release, and a product-named bottle commit) is skipped
# by the last rule, so a new maintenance type never leaks into a release note.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(refactor|perf)", group = "<!-- 1 -->Changed" },
  { message = "^deprecate", group = "<!-- 2 -->Deprecated" },
  { message = "^remove", group = "<!-- 3 -->Removed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^security", group = "<!-- 5 -->Security" },
  { message = ".*", skip = true },
]
topo_order = false
sort_commits = "oldest"
