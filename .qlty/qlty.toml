# --- Repo-specific tuning -----------------------------------------------
# Formula/ and Casks/ are Homebrew DSL, not general Ruby. Homebrew ships its
# own rubocop config (brew/Library/.rubocop.yml) that disables StringLiterals,
# FrozenStringLiteralComment, Documentation and Metrics/* for these files.
# The owner tool is `brew style`, verified 2026-08-29: 4 files inspected,
# no offenses detected (3 formulae + 1 cask).
# Generic rubocop reports 108 findings here (measured 2026-08-29, mostly
# Style/StringLiterals) and its "fixes" would BREAK `brew style`.
# Exclude them; `brew style` owns this surface.
[[exclude]]
plugins = ["rubocop"]
file_patterns = ["Formula/**", "Casks/**"]

# bin/lib/*.sh are sourced fragments, not standalone scripts. They are
# intentionally shebang-less; bin/preflight sources them and already carries
# `# shellcheck source=` directives.
[[triage]]
match.rules = ["shellcheck:2148"]
match.file_patterns = ["bin/lib/**"]
set.ignored = true

# adapters.py is the outbound I/O boundary: running subprocesses is its entire
# purpose, and every argv is built from typed domain models, never user input.
# cli.py imports subprocess solely to catch CalledProcessError. Scope the
# bandit subprocess rules to that boundary rather than disabling them repo-wide.
[[triage]]
match.rules = [
  "bandit:B404",
  "bandit:B603",
]
match.file_patterns = [
  "src/modules/engine/infrastructure/adapters.py",
  "src/modules/engine/api/cli.py",
]
set.ignored = true

# macos-26-intel is a real GitHub-hosted runner that actionlint's bundled label
# list has not caught up to (it knows macos-26 and macos-15-intel). The upstream
# fix is .github/actionlint.yaml, which is committed, but qlty runs actionlint
# sandboxed and does not read it. Scope the suppression to this one rule so
# every other actionlint check stays active.
[[triage]]
match.rules = ["actionlint:runner-label"]
match.file_patterns = [".github/workflows/**"]
set.ignored = true

# bandit B101 flags `assert`, which is what a test IS. Scope the suppression to
# test files only - an assert in production code still reports, because those
# are stripped by `python -O`.
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = [
  "**/tests/**",
  "**/test_*.py",
  "**/conftest.py",
]
set.ignored = true

# Every urlopen in lgtvctrl's display and power control builds its URL from a
# hardcoded http://localhost literal, interpolating only an integer port or a
# UUID read from the local BetterDisplay API. Verified 2026-08-29 by reading
# all eight call sites and every caller of the one helper that takes a url
# parameter. auth.py is deliberately NOT listed: its URL comes from an SSDP
# LOCATION header and is scheme-validated in code instead.
[[triage]]
match.rules = ["bandit:B310"]
match.file_patterns = [
  "packages/lgtvctrl/src/lgtvctrl/power.py",
  "packages/lgtvctrl/src/lgtvctrl/betterdisplay.py",
]
set.ignored = true

# config.py imports pickle to SUBCLASS Unpickler, not to call pickle.loads:
# bscpylgtv writes the keystore with sqlitedict, so the pickled format is
# upstream's and cannot be swapped for JSON. _DataOnlyUnpickler refuses
# find_class, which is the hook every code-executing pickle must pass through,
# leaving only plain-data opcodes. B301 cleared on its own; only the import
# warning remains.
[[triage]]
match.rules = ["bandit:B403"]
match.file_patterns = ["packages/lgtvctrl/src/lgtvctrl/config.py"]
set.ignored = true

# Subprocess review of every call site in packages/, 2026-08-29.
#
# B603 (untrusted input): there is no shell=True anywhere in packages/, and no
# call passes a string command line - every one passes a list, so the shell
# never parses an argument. Interpolated elements (service, account, email,
# formula, window_id) are list members, and bgtail's AppleScript window_id is
# int()-validated at cli.py:260 before it reaches the script text.
#
# B607 (partial executable path): all 22 argv[0] values are hardcoded literals
# - brew, security, git, bw, arp, system_profiler, pmset, open, killall, ip,
# gum, caffeinate. No variable ever occupies position 0. These are user-facing
# CLI tools that must resolve through PATH to respect version managers and
# Homebrew prefixes; hardcoding absolute paths would break them.
#
# B404 is the import warning that follows from the above.
#
# This is scoped to packages/ deliberately. The release engine under src/ keeps
# its own narrower scope, and PATH resolution itself is tracked as backlog #14.
[[triage]]
match.rules = ["bandit:B404", "bandit:B603", "bandit:B607"]
match.file_patterns = ["packages/**"]
set.ignored = true

# B108 flags hardcoded /tmp paths. Every production occurrence was fixed rather
# than scoped: bgtail's job state moved to XDG_STATE_HOME (aff03e4), and no
# real /tmp path remains under any package's source.
#
# What is left is test files, and they are not pytest fixtures - the earlier
# framing was wrong. They are hardcoded strings passed to code under test
# (Path("/tmp/sive-personal")) or mock attribute values that never touch disk
# (mock_sys.executable = "/tmp/python"). Neither creates a file, so the
# symlink-attack shape B108 guards against cannot occur.
[[triage]]
match.rules = ["bandit:B108"]
match.file_patterns = ["**/tests/**", "**/test_*.py"]
set.ignored = true

# The last four security findings, each checked against what the rule asks for
# rather than assumed, 2026-08-29.
#
# B310 x2 (auth.py): the rule says "audit url open for permitted schemes" - it
# asks for a review, and keeps reporting after one, since _fetch_device_info
# already rejects any scheme but http (c817d5f) and still fires. The second
# site is a hardcoded loopback literal. Both audited; nothing left to fix.
#
# B403 (test_client_key_extraction.py): the test imports pickle to BUILD the
# hostile payload it asserts is refused. Removing the import would remove the
# test.
#
# B105 (keychain_macos.py): "master_password" is the Keychain account name -
# the lookup key - not a credential; the secret is the password parameter.
# bandit matches the string value, not the variable name, so renaming does not
# clear it (tried). Changing the value would orphan every stored credential and
# silently lock users out, which is a real migration to satisfy a word-list
# match. No correct code change clears this one.
[[triage]]
match.rules = ["bandit:B310"]
match.file_patterns = ["packages/lgtvctrl/src/lgtvctrl/auth.py"]
set.ignored = true

[[triage]]
match.rules = ["bandit:B403"]
match.file_patterns = ["**/tests/**"]
set.ignored = true

[[triage]]
match.rules = ["bandit:B105"]
match.file_patterns = ["packages/sive/src/sive/core/keychain_macos.py"]
set.ignored = true

# Two findings where the analyser is right about the pattern and wrong about
# the intent, verified by reading the code, 2026-08-29.
#
# S5754 (lgtvctrl/main.py): main_async catches SystemExit from parse_args on
# purpose. argparse raises it for --help and for bad arguments, and the CLI
# converts that into a return code. Reraising, as the rule asks, would make
# `tv --help` exit through a traceback.
#
# S3516 (sive/commands/mise_env.py): run always returns 0 by documented
# contract - "never fail shell startup". It is invoked from a mise env hook,
# where a non-zero exit would break every new shell. The docstring states it.
[[triage]]
match.rules = ["radarlint-python:python:S5754"]
match.file_patterns = ["packages/lgtvctrl/src/lgtvctrl/main.py"]
set.ignored = true

[[triage]]
match.rules = ["radarlint-python:python:S3516"]
match.file_patterns = ["packages/sive/src/sive/commands/mise_env.py"]
set.ignored = true

# bandit B104 reads any "0.0.0.0" literal as a bind address. Here it is an
# input to an IPv4 validator, which must accept it: nothing binds anything.
[[triage]]
match.rules = ["bandit:B104"]
match.file_patterns = ["packages/lgtvctrl/tests/test_parser_registration.py"]
set.ignored = true

# B310 flags urlopen because a URL can carry file:// or a custom scheme. This
# one comes from the file under test, and the test asserts it is https before
# opening it, so the check bandit asks for is already there. Scoped to the one
# file that earns it.
[[triage]]
match.rules = ["bandit:B310"]
match.file_patterns = ["tests/test_sense_schema.py"]
set.ignored = true
